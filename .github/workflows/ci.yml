name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check labfit tests docs examples benchmarks

      - name: Format check
        run: ruff format --check labfit tests docs examples benchmarks

      - name: Type check
        run: mypy labfit

      - name: Run tests with coverage
        run: pytest -q --cov=labfit --cov-report=term-missing --cov-fail-under=90
