name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt pytest pytest-cov ruff mypy

      - name: Lint
        run: ruff check labfit tests

      - name: Type check
        run: mypy --disable-error-code import-untyped labfit

      - name: Run tests with coverage
        run: pytest -q --cov=labfit --cov-report=term-missing --cov-fail-under=90
