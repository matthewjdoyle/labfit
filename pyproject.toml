[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labfit"
version = "0.1.0"
description = "Student-friendly least-squares curve fitting for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Matthew Doyle", email = "matt@matthewd0yle.com"},
]
keywords = ["curve-fitting", "least-squares", "data-analysis", "physics", "chi-squared"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://matthewd0yle.com"
Documentation = "https://matthewd0yle.com/labfit"
Source = "https://github.com/matthewjdoyle/labfit"

[tool.setuptools.packages.find]
include = ["labfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.coverage.run]
source = ["labfit"]
