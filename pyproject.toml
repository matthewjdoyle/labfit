[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labfit"
version = "0.2.0"
description = "Student-friendly least-squares curve fitting for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Matthew Doyle", email = "matt@matthewd0yle.com"},
]
keywords = ["curve-fitting", "least-squares", "data-analysis", "physics", "chi-squared"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
docs = [
    "sphinx>=7.2,<8",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://matthewd0yle.com"
Documentation = "https://matthewd0yle.com/labfit"
Source = "https://github.com/matthewjdoyle/labfit"

[tool.setuptools.packages.find]
include = ["labfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"docs/generate_gallery_assets.py" = ["E402"]
"docs/generate_least_squares_figures.py" = ["E402"]
"benchmarks/benchmark_labfit.py" = ["E402"]

[tool.ruff.format]

[tool.coverage.run]
source = ["labfit"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
