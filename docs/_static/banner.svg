    <circle cx="14" cy="38" r="2" fill="#e67e22"/>
    <circle cx="22" cy="14" r="2" fill="#e67e22"/>
    <circle cx="29" cy="30" r="2" fill="#e67e22"/>
    <circle cx="34" cy="42" r="2" fill="#e67e22"/>
    <circle cx="39" cy="32" r="2" fill="#e67e22"/>
    <circle cx="47" cy="22" r="2" fill="#e67e22"/>
    <circle cx="55" cy="38" r="2" fill="#e67e22"/>

    <path d="M 8,50 C 14,50 16,10 22,12 C 28,14 30,42 34,42 C 38,42 40,22 46,20 C 52,18 54,48 58,48"
