<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180">
  <rect width="800" height="180" rx="8" fill="#f5f7fa"/>

  <!-- LabFit text -->
  <text x="48" y="80" font-family="sans-serif" font-size="44" font-weight="bold" fill="#2c3e50">LabFit</text>

  <!-- Tagline -->
  <text x="50" y="108" font-family="sans-serif" font-size="15" fill="#7f8c8d">least-squares curve fitting for Python</text>

  <!-- Feature tags -->
  <rect x="50" y="122" width="100" height="22" rx="11" fill="#2980b9" opacity="0.1"/>
  <text x="100" y="137" font-family="sans-serif" font-size="11" fill="#2980b9" text-anchor="middle">built-in models</text>

  <rect x="160" y="122" width="100" height="22" rx="11" fill="#1abc9c" opacity="0.1"/>
  <text x="210" y="137" font-family="sans-serif" font-size="11" fill="#1abc9c" text-anchor="middle">error propagation</text>

  <rect x="270" y="122" width="100" height="22" rx="11" fill="#e67e22" opacity="0.1"/>
  <text x="320" y="137" font-family="sans-serif" font-size="11" fill="#e67e22" text-anchor="middle">publication plots</text>

  <!-- Logo graphic (scaled up on the right) -->
  <g transform="translate(600, 20) scale(2.2)">
    <circle cx="32" cy="32" r="32" fill="#2c3e50"/>

    <g stroke="#e67e22" stroke-width="1.3" stroke-linecap="round">
      <line x1="14" y1="34" x2="14" y2="42"/>
      <line x1="11" y1="34" x2="17" y2="34"/>
      <line x1="11" y1="42" x2="17" y2="42"/>

      <line x1="22" y1="11" x2="22" y2="17"/>
      <line x1="19" y1="11" x2="25" y2="11"/>
      <line x1="19" y1="17" x2="25" y2="17"/>

      <line x1="29" y1="26" x2="29" y2="34"/>
      <line x1="26" y1="26" x2="32" y2="26"/>
      <line x1="26" y1="34" x2="32" y2="34"/>

      <line x1="34" y1="38" x2="34" y2="46"/>
      <line x1="31" y1="38" x2="37" y2="38"/>
      <line x1="31" y1="46" x2="37" y2="46"/>

      <line x1="39" y1="28" x2="39" y2="36"/>
      <line x1="36" y1="28" x2="42" y2="28"/>
      <line x1="36" y1="36" x2="42" y2="36"/>

      <line x1="47" y1="19" x2="47" y2="25"/>
